name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real PostgreSQL. The dedup guarantee lives in the DDL — ON CONFLICT, the
    # primary key, the CHECK constraints — and a mock cannot tell you whether any
    # of it actually holds.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heartbeat
          POSTGRES_PASSWORD: heartbeat_ci
          POSTGRES_DB: heartbeat_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U heartbeat -d heartbeat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HEARTBEAT_TEST_DSN: host=localhost port=5434 dbname=heartbeat_test user=heartbeat password=heartbeat_ci
      # the integration tests truncate their tables; the container is disposable
      HEARTBEAT_ALLOW_DESTRUCTIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        # through the Makefile, so a target that rots fails the build
        run: make test

      - name: Validate the compose file
        env:
          POSTGRES_USER: heartbeat
          POSTGRES_PASSWORD: heartbeat_ci
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: admin
        run: docker compose config -q

      - name: Validate the Grafana provisioning files
        run: |
          python -c "import json; json.load(open('docker/grafana/dashboards/heartbeat.json'))"
          python - <<'PY'
          import glob
          import yaml
          for path in glob.glob("docker/grafana/provisioning/**/*.yml", recursive=True):
              yaml.safe_load(open(path))
              print("ok", path)
          PY

      - name: Check the demo script parses
        run: bash -n scripts/demo_failure_modes.sh

  # Brings up the real docker-compose.yml and runs the real proof script, rather
  # than a CI-shaped approximation of either. If this job is green, the pipeline
  # a reviewer clones actually survives a killed consumer, a rebalance and a
  # poison message — it is not a claim in the README.
  pipeline:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure secrets
        run: sed 's/change_me/ci_password/' .env.example > .env

      - name: Install into the venv the scripts expect
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e .

      - name: Check the Makefile targets resolve
        run: make help

      - name: Run the failure-mode proofs
        run: make proofs

      - name: Collect the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: docs/sample_output/

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 100
