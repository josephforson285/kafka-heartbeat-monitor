kafka:
  # all three, so startup survives one broker being down; one would be enough to
  # bootstrap and discover the rest
  bootstrap_servers: localhost:9092,localhost:9094,localhost:9096

  topics:
    raw:
      name: heartbeat.raw
      # 3 so a consumer group can hold more than one member and rebalance
      partitions: 3
      replication_factor: 3
      # what gives acks=all its meaning: with 2 required, a write is refused
      # rather than accepted onto a single surviving copy. 2 of 3 still lets one
      # broker die without stopping ingestion.
      min_insync_replicas: 2
    dlq:
      name: heartbeat.dlq
      partitions: 1
      replication_factor: 3
      min_insync_replicas: 2

  producer:
    acks: all
    enable.idempotence: true
    linger.ms: 20
    compression.type: snappy
    retries: 10
    delivery.timeout.ms: 120000

  consumer:
    group.id: heartbeat-writer
    auto.offset.reset: earliest
    # offsets are committed by hand, after the rows are durable
    enable.auto.commit: false
    max.poll.interval.ms: 300000
    # a consumer killed outright keeps its partitions until this expires, so the
    # lab value is short; production trades that against tolerating GC pauses
    session.timeout.ms: 10000
    heartbeat.interval.ms: 3000

generator:
  customers: 50
  readings_per_second: 25
  seed: 42
  # share of readings deliberately emitted as sensor faults / alerting values
  fault_rate: 0.02
  anomaly_rate: 0.05

heart_rate:
  # outside these bounds a reading is a sensor fault, not a patient event
  min_plausible: 20
  max_plausible: 250
  # clinical bands; a reading can be alerting and still be real data
  bradycardia_below: 60
  tachycardia_above: 100
  critical_above: 180

consumer:
  # the dial between throughput and replay cost: the offset commit after each batch
  # is one round trip, so a bigger batch amortises it and replays more after a crash.
  # 500 measures 14,500 msg/s against a workload of 200 — see docs/performance_metrics.md
  batch_size: 500
  batch_timeout_seconds: 2.0

database:
  host: localhost
  port: 5434
  name: heartbeat
  # user and password come from .env
