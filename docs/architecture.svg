<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="600" fill="#0f172a">Real-Time Heart Beat Monitoring — data flow</text>
  <text x="30" y="62" font-size="13" fill="#64748b">Synthetic sensors → Kafka → validation → PostgreSQL → Grafana</text>

  <!-- generator -->
  <rect x="30" y="110" width="150" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="138" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Generator</text>
  <text x="105" y="157" font-size="11" fill="#64748b" text-anchor="middle">50 customers</text>
  <text x="105" y="170" font-size="11" fill="#64748b" text-anchor="middle">random walk + faults</text>

  <!-- producer -->
  <rect x="220" y="110" width="150" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="295" y="134" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Producer</text>
  <text x="295" y="152" font-size="11" fill="#64748b" text-anchor="middle">acks=all, idempotent</text>
  <text x="295" y="167" font-size="11" fill="#64748b" text-anchor="middle">key = customer_id</text>

  <!-- kafka topic -->
  <rect x="410" y="86" width="200" height="128" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="108" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">heartbeat.raw</text>
  <rect x="428" y="118" width="164" height="24" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="510" y="135" font-size="11" fill="#92400e" text-anchor="middle">partition 0</text>
  <rect x="428" y="146" width="164" height="24" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="510" y="163" font-size="11" fill="#92400e" text-anchor="middle">partition 1</text>
  <rect x="428" y="174" width="164" height="24" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="510" y="191" font-size="11" fill="#92400e" text-anchor="middle">partition 2</text>

  <!-- consumer -->
  <rect x="650" y="102" width="170" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="735" y="126" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Consumer group</text>
  <text x="735" y="145" font-size="11" fill="#64748b" text-anchor="middle">manual offsets</text>
  <text x="735" y="160" font-size="11" fill="#64748b" text-anchor="middle">validate → classify</text>
  <text x="735" y="175" font-size="11" fill="#64748b" text-anchor="middle">batch upsert</text>

  <!-- postgres -->
  <rect x="880" y="76" width="250" height="140" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1005" y="98" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">PostgreSQL</text>
  <rect x="898" y="110" width="214" height="42" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1005" y="127" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">heartbeat_readings</text>
  <text x="1005" y="143" font-size="10" fill="#3b82f6" text-anchor="middle">event_id PK absorbs replays</text>
  <rect x="898" y="158" width="214" height="42" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1005" y="175" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">heartbeat_rejects</text>
  <text x="1005" y="191" font-size="10" fill="#3b82f6" text-anchor="middle">reason + partition + offset</text>

  <!-- dlq -->
  <rect x="650" y="300" width="170" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="735" y="323" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">heartbeat.dlq</text>
  <text x="735" y="341" font-size="10.5" fill="#b45309" text-anchor="middle">replay copy, best effort</text>

  <!-- grafana -->
  <rect x="880" y="300" width="250" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1005" y="323" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">Grafana</text>
  <text x="1005" y="341" font-size="10.5" fill="#dc2626" text-anchor="middle">dashboard + critical HR alert</text>

  <!-- arrows -->
  <line x1="180" y1="143" x2="214" y2="143" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="143" x2="404" y2="143" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="610" y1="143" x2="644" y2="143" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="820" y1="143" x2="874" y2="143" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="735" y1="186" x2="735" y2="294" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="1005" y1="216" x2="1005" y2="294" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- the ordering that makes the pipeline safe -->
  <rect x="30" y="300" width="580" height="86" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="50" y="324" font-size="12.5" font-weight="600" fill="#0f172a">Why nothing is lost or duplicated</text>
  <text x="50" y="345" font-size="11.5" fill="#475569">1.  Readings and rejects are written in one transaction.</text>
  <text x="50" y="362" font-size="11.5" fill="#475569">2.  Offsets are committed only after that transaction lands — a crash replays the batch.</text>
  <text x="50" y="379" font-size="11.5" fill="#475569">3.  event_id is the primary key, so the replay inserts nothing.</text>

  <!-- classification note -->
  <rect x="30" y="410" width="580" height="86" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="50" y="434" font-size="12.5" font-weight="600" fill="#0f172a">Two different rejections</text>
  <text x="50" y="455" font-size="11.5" fill="#475569">190 bpm is valid data about a patient in trouble → stored and flagged critical.</text>
  <text x="50" y="472" font-size="11.5" fill="#475569">900 bpm is not a possible heart rate → a sensor fault, sent to rejects and the DLQ.</text>
  <text x="50" y="489" font-size="11.5" fill="#475569">Malformed JSON, missing fields, bad UUIDs are contract violations → same path.</text>

  <text x="880" y="392" font-size="11" fill="#64748b">Grafana reads PostgreSQL directly;</text>
  <text x="880" y="408" font-size="11" fill="#64748b">it never talks to Kafka.</text>
</svg>
